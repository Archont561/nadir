[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "nadir-sdk"
version = "0.1.0"
description = "Native Python bindings for the nadir photogrammetry engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Archont561", email = "142521648+Archont561@users.noreply.github.com" }]
keywords = ["photogrammetry", "geospatial", "rust", "pyo3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Archont561/nadir"
Repository = "https://github.com/Archont561/nadir"

[tool.maturin]
manifest-path = "../../crates/python-native/Cargo.toml"
python-source = "src"
module-name = "nadir._native"
bindings = "pyo3"
features = ["extension-module"]
strip = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
