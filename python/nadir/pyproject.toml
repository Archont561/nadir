[project]
name = "nadir"
version = "0.1.0"
description = "Python client for the nadir pipeline API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
# No runtime dependencies yet. The V0.1 client is a thin HTTP wrapper; adding `httpx` or
# `requests` is one line here and one entry in `pixi.toml`'s python layer, and until then
# the environment carries nothing for it.
dependencies = []

[project.optional-dependencies]
# `dev` is an optional-dependency group rather than a second install target, so
# `pip install -e python/nadir[dev]` gives a working checkout without a separate
# requirements file that can drift from `pixi.toml`.
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the package directory. Without this, hatchling picks up `tests/` and the turbo facade
# and ships them in the wheel.
packages = ["src/nadir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-ra` so a summary of skips and xfails survives CI logs; `strict-markers` so a typo in a
# marker name is an error rather than a silently ignored filter.
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# The same small set as `workspace.lints` in `Cargo.toml`: enough to catch the mistakes that
# are expensive here, not so much that a contributor learns to run `ruff check --fix`
# without reading the diff.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # Long lines are caught by the formatter; the linter's copy of the same check produces
  # conflicting diagnostics for multi-line strings.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on things that are awkward to name precisely, and `assert` is the point.
"tests/*" = ["S101"]
