name: ci

# Three jobs, one environment. `gates` is everything `pixi run gates` runs plus the build
# and a smoke test of the release binary; `sandbox` validates the offline transport plan;
# `advisories` is the network-dependent scan that is deliberately not a gate. The split is
# by failure mode, not by speed: a red `advisories` means rustsec said something, and a red
# `sandbox` means an airlocked customer's restore would break.
#
# Every pixi step pins the same pixi version, and that pin has to satisfy `requires-pixi`
# in pixi.toml. They are one decision recorded in two files; changing one alone turns every
# job red before it reaches the change under test.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# A new push to the same branch cancels the older run. The check is fast, and a stale
# result on a superseded commit is worse than no result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A warning that is not an error is a warning nobody fixes. Clippy and rustc are gates
  # here, not advisors, so the whole workflow builds with warnings denied.
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (linux-64, default)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # There is no matrix, and its absence is a finding rather than a simplification. The
    # matrix that used to be here ran a `minimal` (no geospatial engines) and an `engines`
    # entry by passing `--feature` to `pixi install`. `pixi install` has no `--feature`
    # flag: features are composed into environments in `pixi.toml`, and `pixi.lock`
    # records one environment, `default`. A second CI configuration is therefore a
    # `[environments] minimal = { features = [...] }` plus a `pixi lock`, not a workflow
    # edit — until that lands, `-e default` is the only environment CI can honestly
    # install with `--locked`.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # The pixi version is pinned, and the pin must satisfy `requires-pixi` in pixi.toml
      # (currently `>=0.81.0`). A pin below that floor fails during this step — before the
      # environment is installed and before any gate runs — with a version-requirement
      # error rather than anything about the change under test. Bump the two together.
      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: default
          cache: true

      # `--locked`, not a bare `pixi install`. A CI run that re-solves produces a different
      # environment from the one that was committed, which means a green run says nothing
      # about the lockfile. This step failing is the correct outcome for a manifest edited
      # without its lock. Not `--frozen`: pixi accepts it alongside `--locked`, but it
      # installs the lockfile *without* checking it against the manifest, which is the
      # check this step exists to perform. (`--frozen-lockfile` is npm's spelling and is
      # not a pixi flag at all — it is what this workflow used to pass.)
      - name: Install the environment
        run: pixi install --locked -e default

      - name: Report versions
        run: pixi run --locked -e default python -VV

      - name: Gates
        run: pixi run --locked gates

      - name: Build
        run: pixi run --locked build

      # The CLI's own integration tests, run against the release binary. The in-workspace
      # `cargo test` runs the debug build; this is the one that would be published, and the
      # one whose exit codes a caller actually sees. Run through `pixi run` so it is the
      # toolchain in `pixi.lock` that builds it, not whatever rustup the runner image ships.
      - name: Release binary smoke test
        run: |
          pixi run --locked -e default cargo install --locked --path . --root target/install
          target/install/bin/nadir --version
          target/install/bin/nadir plan
          target/install/bin/nadir crates

  sandbox:
    name: sandbox plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gates

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: default

      - name: Install the environment
        run: pixi install --locked -e default

      # `pixi-sandbox` is deliberately not a conda dependency or a Pixi task. The
      # SHA-pinned setup action puts the release binary on PATH; using that binary directly
      # keeps transport orchestration out of the project's build task graph. The version is
      # the same one publish-sandbox.yml uses, so validation and publication share a tool.
      - name: Install pixi-sandbox
        uses: Archont561/pixi-sandbox/setup@118d53f07ca7e6bc5c931f1bf6a8d601dcf7a7b9
        with:
          version: v0.3.2

      # The sandbox is what lets a customer with no network restore a working nadir. If the
      # plan drifts from the manifest, the failure surfaces here rather than at the
      # customer's first `restore.sh` run.
      - name: Validate the sandbox publish plan
        run: pixi-sandbox plan --config .pixi-sandbox.toml

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Kept out of `gates` on purpose: it needs the network to fetch the advisory database,
    # and a gate that fails because rustsec.io was unreachable trains people to ignore
    # gates. It runs as its own job, where a network failure is visibly a network failure.
    needs: gates

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: default

      # `-e default`, and not a feature subset: `pixi install` selects environments, not
      # features, and `default` is the only environment `pixi.lock` records.
      - name: Install the environment
        run: pixi install --locked -e default

      - name: Check Rust advisories and licences
        run: pixi run --locked advisories
