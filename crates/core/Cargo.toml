# nadir-core — The types every crate shares: the 16 engine traits, artifact identity, pipeline declaration.
#
# A workspace member with deliberately small dependencies. Artifact identity is the first
# stable public seam, so it pulls in serialization and hashing now; heavier pipeline and
# engine dependencies stay out until those modules are wired.
#
# See the header of `../../Cargo.toml` for why `crates/*` is the member glob and why
# `crates/cli` is excluded from it.

[package]
name = "nadir-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The types every crate shares: the 16 engine traits, artifact identity, pipeline declaration"
keywords = ["photogrammetry", "pipeline"]
categories = ["science::geo"]
# Internal until the crate has a stable public contract.
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
