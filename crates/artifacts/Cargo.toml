# nadir-artifacts — Content-addressed artifact storage and the invalidation rules it makes possible.
#
# A workspace member with no dependencies yet. The stage's real dependencies are listed in
# `.knowledge/references/dependency-matrix.md` and belong here when the stage is written;
# an unused dependency is a download every `pixi install` and every sandbox restore pays
# for.
#
# See the header of `../../Cargo.toml` for why `crates/*` is the member glob and why
# `crates/cli` is excluded from it.

[package]
name = "nadir-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Content-addressed artifact storage and the invalidation rules it makes possible"
keywords = ["photogrammetry", "pipeline"]
categories = ["science::geo"]
# Internal until the crate has a stable public contract.
publish = false

[dependencies]
# The first dependency this crate was always going to grow: digests and artifact identity
# come from `nadir-core`, so there is exactly one blake3 implementation and one hex
# encoding in the workspace. Stage-cache types are new kinds of identity (invocation keys,
# output-tree digests) *over* `ArtifactHash`, not a second hashing scheme beside it.
nadir-core.workspace = true
# Manifests and stage entries are JSON documents on disk: greppable with ordinary tools,
# and never a binary database an interrupted write can corrupt.
serde.workspace = true
serde_json.workspace = true
# Cache failures are a typed taxonomy (schema-incompatible, mutated, missing, extra), not
# strings: the executor must be able to tell "not a hit, run the stage" from "the store is
# corrupt" without parsing error prose.
thiserror.workspace = true

[lints]
workspace = true
